name: ci

on:
  pull_request:
  push:
    branches: [main]

# The job runs code from the pull request (npm ci runs lifecycle scripts), so it
# gets a read-only token and checkout does not leave that token in .git/config.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
